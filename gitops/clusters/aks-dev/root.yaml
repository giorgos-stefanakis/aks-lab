apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: git@github.com:giorgos-stefanakis/aks-lab.git
      targetRevision: main
      path: gitops/clusters/aks-dev/platform
    - repoURL: git@github.com:giorgos-stefanakis/aks-lab.git
      targetRevision: main
      path: gitops/clusters/aks-dev/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
