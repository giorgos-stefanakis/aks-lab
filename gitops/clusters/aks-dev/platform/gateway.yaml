apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: git@github.com:giorgos-stefanakis/aks-lab.git
    targetRevision: main
    path: gitops/components/gateway
    helm:
      valueFiles: [../../envs/aks-dev/gateway.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: lab
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
