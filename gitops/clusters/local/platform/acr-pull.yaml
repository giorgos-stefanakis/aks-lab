apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acr-pull
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: git@github.com:giorgos-stefanakis/aks-lab.git
    targetRevision: main
    path: gitops/components/acr-pull
  destination:
    server: https://kubernetes.default.svc
    namespace: lab
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
