# SSH over port 443: the workstation network blocks port 22 to GitHub (docs/LOG.md).
# Applied once by `make local-up`. Argo then manages everything under the two paths below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: ssh://git@ssh.github.com:443/giorgos-stefanakis/aks-lab.git
      targetRevision: main
      path: gitops/clusters/local/platform
    - repoURL: ssh://git@ssh.github.com:443/giorgos-stefanakis/aks-lab.git
      targetRevision: main
      path: gitops/clusters/local/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
