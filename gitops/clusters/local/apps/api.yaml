apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  sources:
    - repoURL: acrlabyntm5u.azurecr.io/charts
      chart: api
      targetRevision: 0.2.2
      helm:
        valueFiles: [$values/gitops/envs/local/api.yaml]
    - repoURL: ssh://git@ssh.github.com:443/giorgos-stefanakis/aks-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: lab
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
