{{- $envoyProxy := or .Values.envoyService.type .Values.envoyService.annotations }}
{{- if .Values.createGatewayClass }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ required "gatewayClassName is required" .Values.gatewayClassName }}
spec:
  controllerName: {{ .Values.gatewayClassController }}
  {{- if $envoyProxy }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: lab
    namespace: {{ .Values.namespace }}
  {{- end }}
---
{{- if $envoyProxy }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: lab
  namespace: {{ .Values.namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        {{- with .Values.envoyService.type }}
        type: {{ . }}
        {{- end }}
        {{- with .Values.envoyService.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
---
{{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab
  namespace: {{ .Values.namespace }}
  {{- if .Values.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer }}
  {{- end }}
spec:
  gatewayClassName: {{ required "gatewayClassName is required" .Values.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ required "tls.host is required" .Values.tls.host }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.apiService.name }}
          port: {{ .Values.apiService.port }}
