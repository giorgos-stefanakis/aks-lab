{{- if .Values.createGatewayClass }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ required "gatewayClassName is required" .Values.gatewayClassName }}
spec:
  controllerName: {{ .Values.gatewayClassController }}
  {{- with .Values.envoyServiceType }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: lab
    namespace: {{ $.Values.namespace }}
  {{- end }}
---
{{- with .Values.envoyServiceType }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: lab
  namespace: {{ $.Values.namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ . }}
---
{{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab
  namespace: {{ .Values.namespace }}
spec:
  gatewayClassName: {{ required "gatewayClassName is required" .Values.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: lab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.apiService.name }}
          port: {{ .Values.apiService.port }}
