{{- if .Values.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.tls.clusterIssuer }}
spec:
  acme:
    server: {{ .Values.tls.acmeServer }}
    privateKeySecretRef:
      name: {{ .Values.tls.clusterIssuer }}-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: lab
                namespace: {{ .Values.namespace }}
{{- end }}
