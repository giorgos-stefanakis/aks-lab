# GatewayClass of the implementation. Both clusters run Envoy Gateway.
gatewayClassName: ""

# Envoy Gateway ships no GatewayClass.
createGatewayClass: false
gatewayClassController: gateway.envoyproxy.io/gatewayclass-controller

# Service of the Envoy proxy. With both fields empty, Envoy Gateway keeps its default, a plain LoadBalancer.
envoyService:
  # kind has no load balancer, so a LoadBalancer Service never gets an address there.
  type: ""
  # On AKS, annotations bind the load balancer to the static public IP.
  annotations: {}

# Namespace of the workloads that the routes point to.
namespace: lab

# Only the api is public. The indexer has no route.
apiService:
  name: api
  port: 8000
